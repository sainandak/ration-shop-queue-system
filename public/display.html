<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Live Display - Fair Price Shop (#03)</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f172a">
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --bg-color: #030712;
      --card-bg: #0f172a;
      --text-white: #f8fafc;
      --gold-yellow: #facc15;
      --sky-blue: #38bdf8;
      --green-glow: #22c55e;
      --border-color: #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      user-select: none;
      overflow-x: hidden;
    }

    /* Top Navigation Header */
    header {
      padding: 0.75rem 1.25rem;
      background: rgba(15, 23, 42, 0.95);
      border-bottom: 2px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .shop-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .shop-title {
      font-size: clamp(1.1rem, 2.5vw, 1.6rem);
      font-weight: 800;
      color: var(--text-white);
    }

    .header-actions {
      display: flex;
      gap: 0.75rem;
      align-items: center;
    }

    .audio-btn {
      background: #dc2626;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 9999px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      animation: pulse 2s infinite;
      box-shadow: 0 0 15px rgba(220, 38, 38, 0.5);
    }

    .audio-btn.enabled {
      background: #15803d;
      animation: none;
      box-shadow: 0 0 15px rgba(21, 128, 61, 0.4);
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    .clock {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--sky-blue);
      font-family: monospace;
    }

    /* Main Serving Card Area */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      text-align: center;
    }

    .serving-container {
      background: var(--card-bg);
      border: 3px solid #334155;
      border-radius: 20px;
      padding: clamp(1.25rem, 4vw, 2.5rem);
      max-width: 900px;
      width: 100%;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6);
      position: relative;
      transition: all 0.3s ease;
    }

    .serving-badge {
      display: inline-block;
      background: #1e3a8a;
      color: #93c5fd;
      padding: 0.4rem 1.25rem;
      border-radius: 9999px;
      font-size: clamp(0.85rem, 2vw, 1.15rem);
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
      border: 1px solid #3b82f6;
    }

    .token-number {
      font-size: clamp(4rem, 16vw, 8.5rem);
      font-weight: 900;
      color: var(--gold-yellow);
      text-shadow: 0 0 35px rgba(250, 204, 21, 0.4);
      line-height: 1;
      margin: 0.25rem 0 0.5rem 0;
      letter-spacing: -2px;
    }

    .name-telugu {
      font-size: clamp(1.8rem, 6vw, 3.8rem);
      font-weight: 800;
      color: var(--text-white);
      margin-top: 0.25rem;
      line-height: 1.2;
    }

    .name-english {
      font-size: clamp(1.35rem, 4.5vw, 2.5rem);
      font-weight: 700;
      color: var(--sky-blue);
      margin-top: 0.25rem;
      line-height: 1.2;
    }

    .meta-details {
      font-size: clamp(0.9rem, 2.5vw, 1.25rem);
      color: #94a3b8;
      margin-top: 1rem;
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .meta-item {
      background: #1e293b;
      padding: 0.35rem 0.85rem;
      border-radius: 8px;
      border: 1px solid #334155;
    }

    /* Bottom Queue Bar */
    footer {
      background: rgba(15, 23, 42, 0.98);
      border-top: 2px solid var(--border-color);
      padding: 0.75rem 1.25rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    @media (max-width: 768px) {
      footer {
        grid-template-columns: 1fr;
        gap: 0.75rem;
      }
    }

    .queue-box {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      overflow-x: auto;
    }

    .queue-label {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      color: #94a3b8;
      white-space: nowrap;
    }

    .queue-chips {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
    }

    .chip {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 0.3rem 0.75rem;
      border-radius: 9999px;
      font-weight: 700;
      font-size: 0.9rem;
      white-space: nowrap;
    }

    .chip-upcoming { color: var(--gold-yellow); border-color: rgba(250, 204, 21, 0.4); }
    .chip-done { color: var(--green-glow); opacity: 0.8; }
  </style>
</head>
<body>

  <header>
    <div class="shop-header">
      <span style="font-size: 1.5rem;">🌾</span>
      <div class="shop-title" id="shopNameDisplay">Fair Price Shop (#03)</div>
    </div>
    <div class="header-actions">
      <button id="audioToggleBtn" class="audio-btn" onclick="enableAudio()">
        🔊 <span id="audioBtnText">Enable Voice / ఆడియో ఆన్</span>
      </button>
      <div class="clock" id="liveClock">--:--:--</div>
    </div>
  </header>

  <main>
    <div class="serving-container" id="displayBox">
      <div class="serving-badge">NOW SERVING / ఇప్పుడు పిలుస్తున్న టోకెన్</div>
      
      <div class="token-number" id="tokenNum">--</div>
      <div class="name-telugu" id="personNameTe">వేచి ఉండండి...</div>
      <div class="name-english" id="personNameEn">Waiting for Next Token</div>

      <div class="meta-details">
        <div class="meta-item">
          📍 Village: <strong id="personVillage" style="color: white;">--</strong>
        </div>
        <div class="meta-item">
          🪪 Card: <strong id="personCardNo" style="color: var(--sky-blue);">--</strong>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div class="queue-box">
      <span class="queue-label">⏳ Next Waiting:</span>
      <div class="queue-chips" id="upcomingChips">
        <span class="chip">Queue empty</span>
      </div>
    </div>

    <div class="queue-box">
      <span class="queue-label">✅ Recently Served:</span>
      <div class="queue-chips" id="servedChips">
        <span class="chip">None yet</span>
      </div>
    </div>
  </footer>

  <script>
    const socket = io();
    let audioUnlocked = false;
    let speechSynth = window.speechSynthesis;
    let teluguVoice = null;
    let englishVoice = null;

    // Digital Live Clock
    function updateClock() {
      const now = new Date();
      document.getElementById('liveClock').innerText = now.toLocaleTimeString('en-IN', {
        hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true
      });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Voice Engine setup
    function loadVoices() {
      if (!speechSynth) return;
      const voices = speechSynth.getVoices();
      teluguVoice = voices.find(v => v.lang === 'te-IN' || v.lang.startsWith('te')) || null;
      englishVoice = voices.find(v => v.lang === 'en-IN') ||
                     voices.find(v => v.lang.startsWith('en')) ||
                     voices[0];
    }
    if (speechSynth) {
      speechSynth.onvoiceschanged = loadVoices;
      loadVoices();
    }

    // 2-tone Chime Bell with Web Audio API
    function playChime() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        const now = audioCtx.currentTime;

        // Tone 1: High Bell (E5 - 659.25 Hz)
        const osc1 = audioCtx.createOscillator();
        const gain1 = audioCtx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(659.25, now);
        gain1.gain.setValueAtTime(0.3, now);
        gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
        osc1.connect(gain1);
        gain1.connect(audioCtx.destination);
        osc1.start(now);
        osc1.stop(now + 0.8);

        // Tone 2: Harmonious Bell (A5 - 880 Hz)
        const osc2 = audioCtx.createOscillator();
        const gain2 = audioCtx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(880, now + 0.25);
        gain2.gain.setValueAtTime(0.35, now + 0.25);
        gain2.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
        osc2.connect(gain2);
        gain2.connect(audioCtx.destination);
        osc2.start(now + 0.25);
        osc2.stop(now + 1.2);
      } catch (e) {
        console.error('Audio chime error:', e);
      }
    }

    let wakeLock = null;
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {
        console.log('Wake Lock note:', err.message);
      }
    }

    function enableAudio() {
      audioUnlocked = true;
      playChime();
      requestWakeLock();
      
      if (speechSynth) {
        const dummy = new SpeechSynthesisUtterance('Audio enabled');
        dummy.volume = 0.2;
        speechSynth.speak(dummy);
      }

      const btn = document.getElementById('audioToggleBtn');
      btn.classList.add('enabled');
      document.getElementById('audioBtnText').innerText = '🔊 Audio Active / ఆన్ లో ఉంది';
    }

    // Bilingual Voice Announcement
    function makeAnnouncement(data) {
      if (!audioUnlocked) return;

      playChime();

      if (!speechSynth) return;
      speechSynth.cancel();

      setTimeout(() => {
        // English Utterance
        const msgEn = new SpeechSynthesisUtterance(`Token number ${data.tokenNo}, ${data.nameEn}`);
        msgEn.lang = 'en-IN';
        if (englishVoice) msgEn.voice = englishVoice;
        msgEn.rate = 0.9;
        msgEn.pitch = 1.0;

        // Telugu Utterance
        const teluguText = data.nameTe ? data.nameTe : data.nameEn;
        const msgTe = new SpeechSynthesisUtterance(`టోకెన్ సంఖ్య ${data.tokenNo}, ${teluguText}`);
        msgTe.lang = 'te-IN';
        if (teluguVoice) msgTe.voice = teluguVoice;
        msgTe.rate = 0.85;
        msgTe.pitch = 1.0;

        speechSynth.speak(msgEn);
        speechSynth.speak(msgTe);
      }, 700);
    }

    // Visual Flash Animation
    function triggerVisualAlert() {
      const box = document.getElementById('displayBox');
      box.style.borderColor = '#facc15';
      box.style.transform = 'scale(1.02)';

      setTimeout(() => {
        box.style.borderColor = '#334155';
        box.style.transform = 'scale(1)';
      }, 600);
    }

    // Real-time Token Announced
    socket.on('token-announced', (data) => {
      document.getElementById('tokenNum').innerText = '#' + data.tokenNo;
      document.getElementById('personNameTe').innerText = data.nameTe || data.nameEn;
      document.getElementById('personNameEn').innerText = data.nameEn;
      document.getElementById('personVillage').innerText = data.village || '--';
      document.getElementById('personCardNo').innerText = data.rationNo || '--';

      triggerVisualAlert();
      makeAnnouncement(data);
    });

    // Real-time Full Queue Updated
    socket.on('queue-updated', (state) => {
      if (state.serving) {
        document.getElementById('tokenNum').innerText = '#' + state.serving.tokenNo;
        document.getElementById('personNameTe').innerText = state.serving.nameTe || state.serving.nameEn;
        document.getElementById('personNameEn').innerText = state.serving.nameEn;
        document.getElementById('personVillage').innerText = state.serving.village || '--';
        document.getElementById('personCardNo').innerText = state.serving.rationNo || '--';
      } else {
        document.getElementById('tokenNum').innerText = '--';
        document.getElementById('personNameTe').innerText = 'వేచి ఉండండి...';
        document.getElementById('personNameEn').innerText = 'Waiting for Next Token';
        document.getElementById('personVillage').innerText = '--';
        document.getElementById('personCardNo').innerText = '--';
      }

      // Upcoming chips
      const upcoming = state.waiting.slice(0, 5);
      const upcomingContainer = document.getElementById('upcomingChips');
      if (upcoming.length > 0) {
        upcomingContainer.innerHTML = upcoming.map(u => 
          `<span class="chip chip-upcoming">#${u.tokenNo} (${u.nameEn.split(' ')[0]})</span>`
        ).join('');
      } else {
        upcomingContainer.innerHTML = '<span class="chip">Queue empty</span>';
      }

      // Served chips
      const completed = state.completed.slice(-4).reverse();
      const servedContainer = document.getElementById('servedChips');
      if (completed.length > 0) {
        servedContainer.innerHTML = completed.map(c => 
          `<span class="chip chip-done">#${c.tokenNo} (${c.nameEn.split(' ')[0]})</span>`
        ).join('');
      } else {
        servedContainer.innerHTML = '<span class="chip">None yet</span>';
      }
    });

    socket.on('settings-updated', (s) => {
      if (s.shopName) {
        document.getElementById('shopNameDisplay').innerText = s.shopName + (s.village ? ` (${s.village})` : '');
      }
    });

    socket.on('reset-done', () => {
      document.getElementById('tokenNum').innerText = '--';
      document.getElementById('personNameTe').innerText = 'రోజు రీసెట్ చేయబడింది';
      document.getElementById('personNameEn').innerText = 'Day Reset Complete';
      document.getElementById('personVillage').innerText = '--';
      document.getElementById('personCardNo').innerText = '--';
      document.getElementById('upcomingChips').innerHTML = '<span class="chip">Queue empty</span>';
      document.getElementById('servedChips').innerHTML = '<span class="chip">None yet</span>';
    });

    // Auto unlock audio on first tap
    document.addEventListener('click', () => {
      if (!audioUnlocked) enableAudio();
    }, { once: true });
  </script>
</body>
</html>
